name: Build Wear OS APK

on:
  push:
    paths:
      - 'wear-app/**'
      - '.github/workflows/build-wear-app.yml'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  build:
    name: Compile Wear OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Wear OS Debug APK
        working-directory: ./wear-app
        run: gradle assembleDebug --stacktrace

      - name: Upload Wear OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wear-app-debug
          path: wear-app/app/build/outputs/apk/debug/*.apk
          retention-days: 7
